:root{
  --green-900:#0F5132; --green-800:#14663F; --green-700:#177f4d; --green-600:#1a9459;

  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#f8faf9; --border:#e2e8e6;

body.dark{

}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{

  font-size:14px;color:var(--text);
  background-color:var(--bg);
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:28px 28px;
}
#app{display:flex;height:100vh;overflow:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0 0 8px 0;font-weight:600}
/* ---------- SIDEBAR ---------- */
.sidebar{width:248px;flex:0 0 248px;background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;height:100vh}
.side-head{padding:14px 14px 12px;border-bottom:1px solid var(--side-border)}
.side-head .role{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.side-head .clinic{color:#fff;font-weight:700;font-size:14px;margin-top:3px;line-height:1.3}
.side-head select{width:100%;margin-top:9px;background:rgba(255,255,255,.09);color:#fff;border:1px solid var(--side-border);border-radius:8px;padding:6px 8px;font-size:12.5px}
.side-nav{flex:1;overflow-y:auto;padding:8px 8px 16px}
.side-nav::-webkit-scrollbar{width:8px}
.side-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
.nav-group{margin:12px 6px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.62;font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13.2px;line-height:1.3;color:var(--side-text)}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--side-active);color:#fff;font-weight:600}
.nav-item .ic{width:16px;text-align:center;opacity:.9;font-size:13px}
.nav-item .badge{margin-left:auto;background:#e11d48;color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px}
.side-foot{border-top:1px solid var(--side-border);padding:10px 12px 12px;font-size:12.5px}
.side-foot .me{color:#fff;font-weight:600}
.side-foot .me small{display:block;font-weight:400;opacity:.7;font-size:11px;margin-top:2px}
.side-foot .acts{display:flex;flex-direction:column;gap:4px;margin-top:9px}
.side-foot button{background:rgba(255,255,255,.08);border:1px solid var(--side-border);color:var(--side-text);padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px;text-align:left;font-family:inherit}
.side-foot button:hover{background:rgba(255,255,255,.16);color:#fff}
/* ---------- MAIN ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 18px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.topbar h1{font-size:16px;margin:0}
.topbar .sub{color:var(--muted);font-size:12.5px}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{flex:1;overflow:auto;padding:16px 18px}
.content.flush{padding:0;overflow:hidden}
/* ---------- ATOMS ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;background:var(--green-700);color:#fff;font-family:inherit}
.btn:hover{background:var(--green-800)}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.sec:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.block{width:100%}
.input,select.input,textarea.input{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--surface);color:var(--text);font-family:inherit;width:100%}
.input:focus{outline:2px solid var(--green-600);outline-offset:-1px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.out{background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;align-items:center}
.grid{display:grid;gap:12px}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--surface)}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
tbody tr:hover{background:var(--surface-2)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:20px;font-weight:700;margin-top:4px}
.kpi .dt{font-size:11.5px;margin-top:3px}
.up{color:#16a34a}.down{color:var(--danger)}
.sec-title{font-size:13px;font-weight:700;margin-bottom:9px}
</style>
<style id="css2">

.zc1-head{padding:12px;border-bottom:1px solid var(--border)}

.ztop{display:flex;justify-content:space-between;gap:6px;font-size:13px}

.pv{font-size:13px;line-height:1.5}

.calwrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.cal{display:grid;min-width:900px}
.cal .hd{position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--border);padding:9px;font-size:12.5px;font-weight:700;text-align:center;z-index:2}
.cal .tm{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 8px;font-size:11px;color:var(--muted);background:var(--surface-2)}

.ev{margin:2px;border-radius:7px;padding:5px 7px;font-size:11.5px;line-height:1.35;cursor:pointer;border-left:3px solid;height:calc(100% - 4px);overflow:hidden}
.ev b{display:block;font-size:12px}
.ev:hover{filter:brightness(.97)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:13px;font-family:inherit}
.tabs button.on{color:var(--green-700);border-bottom-color:var(--green-700);font-weight:700}
.bar{height:9px;border-radius:999px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green-600)}
.fun{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.fun .fl{width:120px;font-size:12.5px;flex:0 0 120px}
.fun .fb{flex:1;height:24px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fun .fb i{display:block;height:100%;background:linear-gradient(90deg,var(--green-700),var(--green-600))}
.fun .fn{width:86px;text-align:right;font-size:12.5px;font-weight:600}
.cols{display:flex;gap:38px;align-items:flex-end;height:150px;padding:8px 4px}
.colb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.colb .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}

.alert.dg{background:rgba(220,38,38,.1);border-color:var(--danger)}
.alert.wr{background:rgba(217,119,6,.12);border-color:var(--warn)}
.drawer{position:fixed;top:0;right:0;width:420px;max-width:92vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.13);padding:16px;overflow-y:auto;z-index:50}

.ck{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--border)}
.ck .m{width:17px;flex:0 0 17px;font-weight:700}
.ck .m.y{color:#16a34a}.ck .m.n{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c17;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;z-index:99;max-width:70vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
</style>
</head>

  DASH.phieu.forEach(function(p,i){
    var pre=i?DASH.phieu[i-1].n:p.n,roi=i?Math.round((1-p.n/pre)*100):0;
    h+='<div class="fun"><div class="fl">'+p.t+'</div><div class="fb"><i style="width:'+Math.round(p.n/max*100)+'%"></i></div>'+
      '<div class="fn">'+p.n+(i?' <span class="'+(roi>45?'down':'muted')+'" style="font-weight:400">(-'+roi+'%)</span>':'')+'</div></div>';
  });
  h+='<div class="muted" style="font-size:12px;margin-top:8px">Tỉ lệ đến 66% · Tỉ lệ chốt 53% · Rơi nhiều nhất ở bước Đã hẹn → Đã đến.</div></div>';
  /* cảnh báo */
  h+='<div class="card"><div class="sec-title">Cảnh báo cần xử lý ngay</div>';
  DASH.canhbao.forEach(function(c){h+='<div class="alert '+c[0]+'">'+c[1]+'</div>'});
  h+='</div></div>';
  /* biểu đồ */
  h+='<div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px">';
  h+='<div class="card"><div class="sec-title">Doanh thu theo ngày (triệu đồng)</div><div class="cols">';
  DASH.ngay.forEach(function(d){
    h+='<div class="colb"><div class="pair"><div class="b1" style="height:'+Math.round(d[1]/140*100)+'%" title="Ký '+d[1]+'tr"></div>'+
      '<div class="b2" style="height:'+Math.round(d[2]/140*100)+'%" title="Thực thu '+d[2]+'tr"></div></div><small>'+d[0]+'</small></div>';
  });
  h+='</div><div class="muted" style="font-size:11.5px">■ Doanh số ký · □ Tiền thực thu</div></div>';
  h+='<div class="card"><div class="sec-title">Công suất phòng mổ theo ngày</div>';
  DASH.congsuat.forEach(function(c){
    h+='<div class="row" style="margin-bottom:7px"><span style="width:34px;font-size:12px">'+c[0]+'</span>'+
      '<div class="bar" style="flex:1"><i style="width:'+c[1]+'%"></i></div><b style="width:42px;text-align:right;font-size:12.5px">'+c[1]+'%</b></div>';
  });
  h+='</div></div>';
  /* bảng xếp hạng */
  h+='<div class="grid" style="grid-template-columns:repeat(3,1fr)">'+
    rank('Top dịch vụ theo doanh thu',['Dịch vụ','Ca','Doanh thu'],DASH.dv)+
    rank('Top tư vấn viên (tiền thực thu)',['Tư vấn viên','Thực thu','Tỉ lệ chốt'],DASH.tv)+
    rank('Nguồn khách theo ROAS',['Nguồn','ROAS'],DASH.nguon)+'</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn sec sm" onclick="say(\'Xuất báo cáo PDF.\')">Xuất báo cáo PDF</button>'+
    '<button class="btn sec sm" onclick="say(\'Đã bật gửi báo cáo Zalo lúc 20:00 hằng ngày.\')">Gửi báo cáo qua Zalo</button>'+
    '<span class="muted" style="font-size:12px">Mọi con số đều bấm được để mở danh sách chi tiết phía sau.</span></div>';
  return h;
}
function rank(t,head,rows){
  var h='<div class="card" style="padding:0;overflow:hidden"><div class="sec-title" style="padding:12px 14px 0">'+t+'</div><table><thead><tr>'+
    head.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'});
  return h+'</tbody></table></div>';
}
/* ================= TRANG CHƯA DỰNG ================= */
function viewSoon(id){
  return '<div class="card"><div class="empty"><div style="font-size:34px">🚧</div>'+
   '<h3 style="margin-top:10px">'+esc(TITLES[id]||'Màn hình')+'</h3>'+
   '<p>Màn hình này đã được đặc tả trong tài liệu sản phẩm nhưng chưa dựng trong bản prototype.</p>'+
   '<p class="muted">Prototype tập trung 5 màn hình lõi: Hộp thư Zalo · Lễ tân · Lịch hẹn · Hồ sơ khách hàng · Lịch phòng mổ · Dashboard chủ đầu tư.</p>'+
   '<div class="row" style="justify-content:center;margin-top:14px">'+
   '<button class="btn sm" onclick="go(\'zalo\')">Hộp thư Zalo</button>'+
   '<button class="btn sec sm" onclick="go(\'lichhen\')">Lịch hẹn</button>'+
   '<button class="btn sec sm" onclick="go(\'khachhang\')">Hồ sơ khách</button>'+
   '<button class="btn sec sm" onclick="go(\'phongmo\')">Lịch phòng mổ</button>'+
   '<button class="btn sec sm" onclick="go(\'dashboard\')">Dashboard</button></div></div></div>';
}
</script>
<script>
var CUR='zalo';
var SUB={zalo:'Toàn bộ hội thoại của phòng khám. Khách nhắn là hiện ngay, không cần bấm làm mới.',
 lichhen:'Đặt, dời, xác nhận lịch tư vấn và khám trong ngày.',
 khachhang:'Toàn bộ đời sống của khách tại phòng khám trong một trang.',
 phongmo:'Tài nguyên đắt nhất của phòng khám — chỉ ca đủ điều kiện tiền phẫu mới được xác nhận.',
 dashboard:'Bức tranh kinh doanh một màn hình cho chủ đầu tư.'};
function sidebar(){
  var h='<aside class="sidebar"><div class="side-head"><div class="role">Quản trị</div>'+
   '<div class="clinic">Phòng khám Phẫu thuật Thẩm mỹ</div>'+
   '<select onchange="say(\'Đã chuyển cơ sở: \'+this.value)"><option>Cơ sở: Phẫu thuật Thẩm mỹ</option>'+
   '<option>Cơ sở: Dr. Tú — Y học bào thai</option><option>Gộp toàn công ty</option></select></div><nav class="side-nav">';
  MENU.forEach(function(g){
    if(g.group)h+='<div class="nav-group">'+g.group+'</div>';
    g.items.forEach(function(i){
      var id=i.id==='dashboard2'?'dashboard':(i.id==='khach'?'khachhang':i.id);
      h+='<div class="nav-item'+(id===CUR&&i.id!=='dashboard2'?' active':'')+'" onclick="go(\''+id+'\')">'+
        '<span class="ic">'+i.ic+'</span><span>'+i.t+'</span>'+(i.badge?'<span class="badge">'+i.badge+'</span>':'')+'</div>';
    });
  });
  h+='</nav><div class="side-foot"><div class="me">Ths. BS Nguyễn Ngọc Tú<small>Chủ đầu tư · Quản trị hệ thống</small></div>'+
   '<div class="acts"><button onclick="toggleDark()" id="btnDark">🌙 Chuyển nền tối</button>'+
   '<button onclick="say(\'Mở biểu mẫu Đổi mật khẩu.\')">🔑 Đổi mật khẩu</button>'+
   '<button onclick="say(\'Đã đăng xuất khỏi hệ thống (mô phỏng).\')">⎋ Đăng xuất</button></div></div></aside>';
  return h;
}
function screen(){
  if(CUR==='zalo')return viewZalo();
  if(CUR==='lichhen')return viewLichHen();
  if(CUR==='khachhang')return viewKhachHang();
  if(CUR==='phongmo')return viewPhongMo();
  if(CUR==='dashboard')return viewDashboard();
  return viewSoon(CUR);
}
function render(){
  var t=CUR==='khachhang'?'Hồ sơ khách hàng thẩm mỹ':(CUR==='dashboard'?'Dashboard chủ đầu tư':(TITLES[CUR]||'Màn hình'));
  var flush=CUR==='zalo';
  document.getElementById('app').innerHTML=sidebar()+
   '<div class="main"><div class="topbar"><div><h1>'+t+'</h1>'+
   (SUB[CUR]?'<div class="sub">'+SUB[CUR]+'</div>':'')+'</div>'+
   '<div class="right"><span class="muted" style="font-size:12px">12/08/2026 · 16:05</span>'+
   '<button class="btn sec sm" onclick="say(\'Không có thông báo mới.\')">🔔</button></div></div>'+
   '<div class="content'+(flush?' flush':'')+'">'+screen()+'</div></div>';
  var m=document.getElementById('zmsgs');if(m)m.scrollTop=m.scrollHeight;
  var b=document.getElementById('btnDark');
  if(b)b.textContent=document.body.classList.contains('dark')?'☀ Chuyển nền sáng':'🌙 Chuyển nền tối';
}
function go(id){CUR=id;ST.ca=null;render();window.scrollTo(0,0)}
function setTab(t){ST.tab=t;var l=CHATS.filter(function(c){return c.tab===t});if(l.length)ST.chat=l[0].id;render()}
function setQ(v){ST.q=v;render()}
function pick(id){ST.chat=id;var c=CHATS.filter(function(x){return x.id===id})[0];if(c)c.chua=0;render()}
function setHen(k){ST.henLoc=k;render()}
function setKTab(t){ST.ktab=t;render()}
function setKy(k){ST.ky=k;render()}
function openCa(i){ST.ca=i;render()}
function closeCa(){ST.ca=null;render()}
function send(){
  var b=document.getElementById('zbox');if(!b||!b.value.trim())return;
  var c=CHATS.filter(function(x){return x.id===ST.chat})[0];
  if(c){c.tin.push({d:'out',t:b.value.trim(),g:'16:0'+(5+c.tin.length%4),by:'Ths. BS Nguyễn Ngọc Tú'});
    if(c.stage==='MOI')c.stage='LIENHE';}
  b.value='';render();
}
function keySend(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function toggleDark(){document.body.classList.toggle('dark');render()}
var tmr;
function say(m){
  var old=document.getElementById('tst');if(old)old.remove();
  var d=document.createElement('div');d.className='toast';d.id='tst';d.textContent=m;document.body.appendChild(d);
  clearTimeout(tmr);tmr=setTimeout(function(){var x=document.getElementById('tst');if(x)x.remove()},3200);
}
render();
</script>
</body>
</html>
